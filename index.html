<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sangeet Performances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Caveat&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6efe6; --card:#fbf7f0; --ink:#1d3a34; --gold:#8a6a43; --muted:#6b6258;
    --solo:#f6cfcb; --solo-ink:#8a3a3a;
    --duet:#cfe5d6; --duet-ink:#2e6045;
    --group:#ddd5f1; --group-ink:#51429a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Playfair Display',serif; color:var(--ink); min-height:100vh;
    background:
      radial-gradient(ellipse at 0% 0%, #f4d3c5 0, transparent 35%),
      radial-gradient(ellipse at 100% 0%, #f4d3c5 0, transparent 35%),
      radial-gradient(ellipse at 50% 100%, #efe3d3 0, transparent 50%),
      var(--bg);
    background-attachment:fixed;
  }
  header{text-align:center;padding:56px 16px 24px;position:relative}
  .lantern{position:absolute;top:0;font-size:46px;animation:sway 4s ease-in-out infinite;transform-origin:top center;filter:drop-shadow(0 4px 8px rgba(200,150,50,.5))}
  .lantern::before{content:"";position:absolute;left:50%;top:-40px;width:1px;height:40px;background:var(--gold)}
  .l1{left:6%}.l2{left:14%;font-size:30px;animation-delay:.8s}.l3{right:14%;font-size:30px;animation-delay:1.4s}.l4{right:6%;animation-delay:.4s}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  h1{font-size:clamp(40px,8vw,84px);letter-spacing:.04em;font-weight:500;line-height:1}
  .script{font-family:'Great Vibes',cursive;color:var(--gold);font-size:clamp(46px,9vw,96px);margin-top:-6px;line-height:1.1}
  .rule{display:flex;align-items:center;justify-content:center;gap:12px;color:#b4506b;margin:6px 0 14px}
  .rule::before,.rule::after{content:"";width:90px;height:1px;background:var(--gold)}
  .tag{font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  .tag span{margin:0 8px}
  main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
  .card{
    background:var(--card);border-radius:18px;padding:16px 18px 20px;position:relative;overflow:hidden;
    box-shadow:0 6px 24px rgba(120,90,60,.12);
    background-image:radial-gradient(circle at 12% 10%, rgba(240,190,200,.35), transparent 40%);
    transition:transform .25s;
  }
  .card:hover{transform:translateY(-4px)}
  .photo{
    width:100%;aspect-ratio:1/.72;object-fit:cover;display:block;
    border-radius:50% 50% 10px 10px / 62% 62% 10px 10px;background:#e7dccd;
  }
  .no{position:absolute;top:12px;right:14px;background:var(--ink);color:#fff;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:99px}
  .name{font-size:22px;font-weight:600;margin:12px 0 8px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 16px;border-radius:99px;font-size:15px}
  .pill.solo{background:var(--solo);color:var(--solo-ink)}
  .pill.duet{background:var(--duet);color:var(--duet-ink)}
  .pill.group{background:var(--group);color:var(--group-ink)}
  hr{border:0;border-top:1px solid #e6dccd;margin:14px 0 10px}
  .songs b{font-weight:600;font-size:15px}
  .songs b::before{content:"♫ ";color:var(--ink)}
  .songs ul{margin:6px 0 0 6px;padding-left:18px;font-size:15px;line-height:1.6}
  #status{text-align:center;padding:40px 16px;color:var(--muted);font-family:'Caveat',cursive;font-size:24px}
  footer{text-align:center;font-family:'Caveat',cursive;font-size:26px;color:var(--gold);padding-bottom:40px}
  html{-webkit-text-size-adjust:100%}
  @media(hover:none){.card:hover{transform:none}}
  @media(max-width:600px){
    body{background-attachment:scroll}
    .lantern{font-size:28px}.l2,.l3{display:none}.l1{left:4%}.l4{right:4%}
    header{padding:44px 14px 12px}
    .rule{margin:2px 0 10px}.rule::before,.rule::after{width:44px}
    .tag{letter-spacing:.12em;font-size:10px;line-height:1.9}.tag span{margin:0 4px}
    main{padding:12px max(14px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom))}
    .grid{grid-template-columns:1fr;gap:16px}
    .card{padding:14px 14px 18px;border-radius:16px}
    .photo{aspect-ratio:1/.8}
    .name{font-size:21px}
    .songs ul{font-size:16px}
    footer{font-size:22px}
  }
  @media(min-width:601px) and (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
  <div class="lantern l1">🏮</div><div class="lantern l2">🏮</div>
  <div class="lantern l3">🏮</div><div class="lantern l4">🏮</div>
  <h1>SANGEET</h1>
  <div class="script">Performances</div>
  <div class="rule">♥</div>
  <div class="tag">Dance <span>•</span> Music <span>•</span> Celebration <span>•</span> Togetherness</div>
</header>

<main>
  <div id="status">Loading performances…</div>
  <div class="grid" id="grid"></div>
</main>
<footer>Same People, More Memories ♥</footer>

<script>
/* ============ SETUP (only thing you need to edit) ============
   1. In Google Sheets: Share → "Anyone with the link" → Viewer
   2. Paste your Sheet ID below (the long text in the sheet URL between /d/ and /edit)
   3. Sheet columns in row 1, exactly:
        Photo | Name | Type | Songs | Dance Number
      - Photo: image link (Google Drive share link, or any image URL)
      - Type: Solo / Duet / Group
      - Songs: separate several songs with a comma, or a new line in the cell
*/
const SHEET_ID  = "1b0u2xS9eujLqClpXt0rnd5i5eGBMqpRsh5y45llbHh4";
const SHEET_TAB = "Sheet1";   // name of the tab at the bottom of your sheet
// Paste your Apps Script "Web app" URL here (ends with /exec). When set, it is used instead of the direct sheet link.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk6GguEcB3Qewk2NeQdtMOkjijU1W8gXQDDCHpp1PagPs9zuphoO5mmbT7nlodLFkq/exec";
/* ============================================================= */

const DEMO = [
  {photo:"",name:"Riya Sharma",type:"Solo",songs:"Kesariya, Apna Bana Le",no:"1"},
  {photo:"",name:"Aditya & Mrunal",type:"Duet",songs:"Tum Se Hi, Raataan Lambiyan",no:"2"},
  {photo:"",name:"Cousins Group",type:"Group",songs:"Kala Chashma, Nachde Ne Saare",no:"3"},
];

function parseCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&t[i+1]=='\n')i++; r.push(c);c="";rows.push(r);r=[] }
    else c+=ch;
  }
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}

function photoUrl(u){
  u=(u||"").trim(); if(!u) return "";
  const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
  return (u.includes("drive.google.com")&&m)?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`:u;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON={solo:"💃",duet:"👫",group:"👯"};
const PLACEHOLDER="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290"><rect width="100%" height="100%" fill="#e7dccd"/><text x="50%" y="55%" font-size="60" text-anchor="middle">💃</text></svg>');

function render(list){
  const grid=document.getElementById("grid");
  list.sort((a,b)=>(parseFloat(a.no)||999)-(parseFloat(b.no)||999));
  grid.innerHTML=list.map(p=>{
    const type=(p.type||"").trim(); const k=type.toLowerCase().replace("dute","duet");
    const cls=["solo","duet","group"].includes(k)?k:"group";
    const songs=(p.songs||"").split(/\n|,|;/).map(s=>s.trim()).filter(Boolean);
    return `<article class="card">
      ${p.no?`<div class="no">#${esc(p.no)}</div>`:""}
      <img class="photo" loading="lazy" referrerpolicy="no-referrer" src="${esc(photoUrl(p.photo)||PLACEHOLDER)}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
      <div class="name">${esc(p.name)}</div>
      <span class="pill ${cls}">${ICON[cls]} ${esc(type||"Group")}</span>
      <hr>
      <div class="songs"><b>Songs:</b><ul>${songs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    </article>`}).join("");
  document.getElementById("status").style.display="none";
}

function loadViaAppsScript(){
  const s=document.createElement("script");
  window.__sheetCb=data=>{ if(data&&data.length) render(data); else document.getElementById("status").textContent="No performances found in the sheet yet."; };
  s.src=APPS_SCRIPT_URL+(APPS_SCRIPT_URL.includes("?")?"&":"?")+"callback=__sheetCb&t="+Date.now();
  s.onerror=()=>{document.getElementById("status").textContent="Couldn't reach the Apps Script. Check it is deployed with access “Anyone”."};
  document.body.appendChild(s);
}

async function load(){
  if(APPS_SCRIPT_URL){ loadViaAppsScript(); return; }
  if(SHEET_ID.startsWith("PASTE")){
    render(DEMO);
    const s=document.getElementById("status");s.style.display="block";
    s.textContent="Showing demo data — add your Google Sheet ID in index.html";return;
  }
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
    const res=await fetch(url); if(!res.ok) throw 0;
    const rows=parseCSV(await res.text()).filter(r=>r.some(x=>x.trim()));
    const head=rows.shift().map(h=>h.trim().toLowerCase());
    const col=(...n)=>head.findIndex(h=>n.some(x=>h.includes(x)));
    const ci={photo:col("photo"),name:col("name"),type:col("type"),songs:col("song"),no:col("number","no")};
    const list=rows.map(r=>({photo:r[ci.photo],name:r[ci.name],type:r[ci.type],songs:r[ci.songs],no:r[ci.no]})).filter(p=>p.name);
    if(!list.length) throw 0;
    render(list);
  }catch(e){
    document.getElementById("status").textContent="Couldn't load the sheet. Check the Sheet ID, tab name, and that sharing is set to “Anyone with the link”.";
  }
}
load();
</script>
</body>
</html>
